<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>harustream-provider-api · Health</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a31;
    --panel-2: #1a2342;
    --border: #26315a;
    --text: #e6e9f5;
    --muted: #8b94b8;
    --accent: #5b8cff;
    --ok: #35d07f;
    --warn: #f0b429;
    --err: #ff5c6c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #101732, var(--bg));
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #7a5bff);
    display: grid; place-items: center;
    font-weight: 800; color: #fff; font-size: 16px;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .pill {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel);
    font-size: 12px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.degraded { background: var(--warn); }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .value small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .section { margin-top: 22px; }
  .section > h2 {
    font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .8px; margin: 0 0 10px;
  }
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .section-head h2 { margin: 0; }
  .updated { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .providers {
    display: flex; flex-wrap: wrap; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
  }
  .providers .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel-2);
    font-size: 12px;
  }
  .providers .chip .name { font-weight: 600; }
  .providers .chip .val { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .providers .chip .ver { color: var(--muted); font-size: 11px; }
  .err-banner {
    background: rgba(220, 60, 60, 0.12); border: 1px solid rgba(220, 60, 60, 0.45);
    color: #ff9d9d; border-radius: 10px; padding: 10px 14px;
    font-size: 12.5px; line-height: 1.5; margin-bottom: 16px;
    font-family: var(--mono);
  }
</style>
</head>
<body>
<div class="err-banner" id="errBanner" hidden></div>
<header>
  <div class="logo">P</div>
  <div>
    <h1>harustream-provider-api</h1>
    <div class="sub" id="version">—</div>
  </div>
  <span class="pill"><span class="dot" id="healthDot"></span><span id="healthText">checking…</span></span>
</header>

<main>
  <div class="cards">
    <div class="card"><div class="label">Status</div><div class="value" id="statStatus">—</div></div>
    <div class="card"><div class="label">Providers</div><div class="value" id="statProviders">—</div></div>
    <div class="card"><div class="label">Workers</div><div class="value" id="statWorkers">—</div></div>
    <div class="card"><div class="label">Gateway</div><div class="value"><span id="statLatency">—</span><small> ms</small></div></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Providers</h2>
      <span class="updated" id="provUpdated"></span>
    </div>
    <div class="providers" id="providerList">—</div>
  </div>
</main>

<script>
"use strict";

// When the dashboard is served by a gateway (/api/* is relative) or opened
// directly from disk (file:// — nothing to be relative to), pick a local
// gateway explicitly. Override with ?api=http://host:port.
const API_BASE = (() => {
  const q = new URLSearchParams(location.search).get("api");
  if (q) return q.replace(/\/+$/, "");
  if (location.protocol === "file:") return "http://localhost:8787";
  return "";
})();

const $ = (id) => document.getElementById(id);

function showError(msg) {
  const banner = $("errBanner");
  if (!banner) return;
  banner.textContent = "⚠ " + msg;
  banner.hidden = false;
}

function clearError() {
  const banner = $("errBanner");
  if (banner) banner.hidden = true;
}

async function json(url) {
  const started = performance.now();
  const res = await fetch(API_BASE + url, { headers: { Accept: "application/json" } });
  const ms = Math.round(performance.now() - started);
  let body;
  try { body = await res.json(); } catch { body = await res.text(); }
  return { res, body, ms };
}

async function refreshHealth() {
  try {
    const { body, ms } = await json("/health");
    const ok = body.status === "healthy";
    $("statStatus").textContent = body.status || "—";
    $("statProviders").textContent = body.providers ?? "—";
    $("statWorkers").textContent = body.workers_ok ? "ok" : "down";
    $("statLatency").textContent = ms;
    $("healthText").textContent = ok ? "healthy" : "degraded";
    $("healthDot").className = "dot " + (ok ? "ok" : "degraded");
    clearError();
  } catch (err) {
    $("statStatus").textContent = "down";
    $("healthText").textContent = "unreachable";
    $("healthDot").className = "dot degraded";
    showError(`API unreachable (${API_BASE || "same origin"}): ${err.message || err} — start a gateway on :8787 (just dev / just dev-node), or open this page with ?api=http://host:port`);
  }
}

async function refreshInfo() {
  try {
    const { body } = await json("/info");
    $("version").textContent = `v${body.version} · ${body.status}`;
  } catch { $("version").textContent = "—"; }
}

async function refreshProviders() {
  try {
    const { body } = await json("/providers");
    const list = (body.providers || []).filter((p) => !p.disabled);
    const wrap = $("providerList");
    wrap.textContent = "";
    for (const p of list) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.title = `value: ${p.value}`;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = p.display_name || p.value;
      const val = document.createElement("span");
      val.className = "val";
      val.textContent = p.value;
      const ver = document.createElement("span");
      ver.className = "ver";
      ver.textContent = p.version ? "v" + p.version : "";
      chip.append(name, val, ver);
      wrap.appendChild(chip);
    }
    $("provUpdated").textContent = "updated " + new Date().toLocaleTimeString();
    clearError();
    return true;
  } catch (err) {
    $("providerList").textContent = "unavailable";
    showError(`provider list unavailable (${API_BASE || "same origin"}): ${err.message || err}`);
    return false;
  }
}

// Real-time refresh: health + info every 15s, provider list every 60s.
refreshInfo();
refreshHealth();
refreshProviders();
setInterval(refreshHealth, 15000);
setInterval(refreshInfo, 15000);
setInterval(refreshProviders, 60000);
</script>
</body>
</html>
