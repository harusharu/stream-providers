name: rust-api

on:
  push:
    paths:
      - 'rust-api/src/**'
      - 'rust-api/worker/**'
      - 'rust-api/tests/**'
      - 'rust-api/Cargo.toml'
      - 'rust-api/Cargo.lock'
      - 'manifest.json'
  pull_request:
    paths:
      - 'rust-api/src/**'
      - 'rust-api/worker/**'
      - 'rust-api/tests/**'
      - 'rust-api/Cargo.toml'
      - 'rust-api/Cargo.lock'
      - 'manifest.json'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-api

      - name: Format
        working-directory: rust-api
        run: cargo fmt --check

      - name: Lint
        working-directory: rust-api
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        working-directory: rust-api
        run: cargo test --lib --test integration

      - name: Docs
        working-directory: rust-api
        run: RUSTDOCFLAGS="-D warnings" cargo doc --lib --no-deps

  e2e:
    name: e2e provider sweep
    runs-on: ubuntu-latest
    # Real-network provider sweep; run explicitly, not on every push.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-api

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build bundles
        run: npm ci && npm run build

      - name: Sweep all enabled providers
        working-directory: rust-api
        run: cargo test --test e2e -- --ignored --test-threads=1