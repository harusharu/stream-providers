name: rustdoc

# Builds the rustdoc for the API crate and deploys it to GitHub Pages.
# Manual trigger only — docs are not rebuilt on every push.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build rustdoc (lib docs, warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --lib --no-deps

      - name: Create root redirect page
        run: |
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=harustream_provider_api/index.html">
            <link rel="canonical" href="harustream_provider_api/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="harustream_provider_api/index.html">harustream-provider-api documentation</a>.</p>
          </body>
          </html>
          EOF
