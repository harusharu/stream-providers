[package]
name = "harustream-provider-api"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust/Actix API gateway that executes Vega/stream-providers bundles via isolated Node sidecar workers"
license = "MIT"

[dependencies]
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-cors = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
governor = "0.7"
moka = { version = "0.12", features = ["future"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
rustls = "0.23"
rustls-pemfile = "2"

[dev-dependencies]
actix-http = "3"
actix-rt = "2"
tempfile = "3"
rcgen = "0.13"
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"